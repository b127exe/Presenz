services:
  - type: web
    name: presenz-attendance-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DATABASE_URL
        fromDatabase:
          name: presenz-attendance-db
          property: connectionString

databases:
  - name: presenz-attendance-db
    plan: free
    databaseName: presenz_attendance
    ipAllowList: []
